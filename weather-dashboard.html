<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .search-section {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            width: 300px;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        button {
            padding: 12px 30px;
            background: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        button:hover {
            transform: translateY(-2px);
        }

        .preset-btn {
            background: rgba(255,255,255,0.8);
            padding: 8px 20px;
            font-size: 14px;
        }

        .preset-btn:hover {
            background: white;
        }

        .weather-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .weather-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .city-name {
            font-size: 2em;
            color: #333;
            margin-bottom: 10px;
        }

        .weather-emoji {
            font-size: 3em;
            margin: 10px 0;
        }

        .temperature {
            font-size: 2.5em;
            color: #667eea;
            font-weight: bold;
            margin: 15px 0;
        }

        .description {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 15px;
            text-transform: capitalize;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }

        .detail {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            color: #999;
            font-size: 0.85em;
            margin-bottom: 5px;
        }

        .detail-value {
            color: #333;
            font-weight: bold;
            font-size: 1.1em;
        }

        .forecast {
            margin-top: 30px;
        }

        .forecast-title {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 15px;
        }

        .forecast-items {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
        }

        .forecast-item {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s;
        }

        .forecast-item:hover {
            background: #667eea;
            color: white;
        }

        .forecast-day {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .forecast-emoji {
            font-size: 2em;
            margin: 8px 0;
        }

        .forecast-temp {
            font-size: 0.9em;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌤️ Weather Dashboard</h1>
        
        <div class="search-section">
            <input type="text" id="searchInput" placeholder="Search for a city..." onkeypress="handleKeyPress(event)">
            <button onclick="searchWeather()">Search</button>
            <button class="preset-btn" onclick="searchWeatherByCity('London')">London</button>
            <button class="preset-btn" onclick="searchWeatherByCity('New York')">New York</button>
            <button class="preset-btn" onclick="searchWeatherByCity('Tokyo')">Tokyo</button>
            <button class="preset-btn" onclick="searchWeatherByCity('Paris')">Paris</button>
            <button class="preset-btn" onclick="searchWeatherByCity('Sydney')">Sydney</button>
        </div>

        <div id="weatherContainer" class="weather-container"></div>
    </div>

    <script>
        const API_KEY = 'ff69e3aef2f1f32f0ab6d12f41015a61';
        const weatherContainer = document.getElementById('weatherContainer');

        const weatherEmojis = {
            'clear sky': '☀️',
            'few clouds': '🌤️',
            'scattered clouds': '☁️',
            'broken clouds': '☁️',
            'shower rain': '🌧️',
            'rain': '🌧️',
            'thunderstorm': '⛈️',
            'snow': '❄️',
            'mist': '🌫️',
            'fog': '🌫️',
            'smoke': '💨',
            'haze': '🌫️',
            'dust': '🌪️',
            'sand': '🏜️',
            'ash': '🌋',
            'squall': '💨',
            'tornado': '🌪️'
        };

        function getWeatherEmoji(description) {
            const lower = description.toLowerCase();
            for (const [key, emoji] of Object.entries(weatherEmojis)) {
                if (lower.includes(key)) return emoji;
            }
            return '🌍';
        }

        async function getCoordinates(city) {
            try {
                const response = await fetch(`https://api.openweathermap.org/geo/1.0/direct?q=${city}&limit=1&appid=${API_KEY}`);
                const data = await response.json();
                if (data.length === 0) throw new Error('City not found');
                return { lat: data[0].lat, lon: data[0].lon, name: data[0].name };
            } catch (error) {
                showError(`Could not find coordinates for "${city}"`);
                return null;
            }
        }

        async function getWeather(lat, lon, cityName) {
            try {
                const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=metric&appid=${API_KEY}`);
                const weather = await response.json();

                const forecastResponse = await fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&units=metric&appid=${API_KEY}`);
                const forecastData = await forecastResponse.json();

                displayWeather(weather, forecastData, cityName);
            } catch (error) {
                showError('Error fetching weather data');
            }
        }

        function displayWeather(weather, forecastData, cityName) {
            const { temp, feels_like, humidity, pressure } = weather.main;
            const { speed } = weather.wind;
            const { visibility } = weather;
            const { all: clouds } = weather.clouds;
            const description = weather.weather[0].description;
            const emoji = getWeatherEmoji(description);

            let forecastHTML = '<div class="forecast"><h3 class="forecast-title">5-Day Forecast</h3><div class="forecast-items">';
            const dailyForecasts = {};
            
            forecastData.list.forEach(item => {
                const date = new Date(item.dt * 1000);
                const day = date.toLocaleDateString('en-US', { weekday: 'short' });
                if (!dailyForecasts[day]) {
                    dailyForecasts[day] = item;
                }
            });

            Object.entries(dailyForecasts).slice(0, 5).forEach(([day, item]) => {
                const forecastEmoji = getWeatherEmoji(item.weather[0].description);
                forecastHTML += `
                    <div class="forecast-item">
                        <div class="forecast-day">${day}</div>
                        <div class="forecast-emoji">${forecastEmoji}</div>
                        <div class="forecast-temp">${Math.round(item.main.temp)}°C</div>
                    </div>
                `;
            });
            forecastHTML += '</div></div>';

            const html = `
                <div class="weather-card">
                    <div class="city-name">${cityName}, ${weather.sys.country}</div>
                    <div class="weather-emoji">${emoji}</div>
                    <div class="temperature">${Math.round(temp)}°C</div>
                    <div class="description">${description}</div>
                    <div class="weather-details">
                        <div class="detail">
                            <div class="detail-label">Feels Like</div>
                            <div class="detail-value">${Math.round(feels_like)}°C</div>
                        </div>
                        <div class="detail">
                            <div class="detail-label">Humidity</div>
                            <div class="detail-value">${humidity}%</div>
                        </div>
                        <div class="detail">
                            <div class="detail-label">Wind Speed</div>
                            <div class="detail-value">${speed} m/s</div>
                        </div>
                        <div class="detail">
                            <div class="detail-label">Pressure</div>
                            <div class="detail-value">${pressure} hPa</div>
                        </div>
                        <div class="detail">
                            <div class="detail-label">Visibility</div>
                            <div class="detail-value">${(visibility / 1000).toFixed(1)} km</div>
                        </div>
                        <div class="detail">
                            <div class="detail-label">Cloud Coverage</div>
                            <div class="detail-value">${clouds}%</div>
                        </div>
                    </div>
                    ${forecastHTML}
                </div>
            `;
            weatherContainer.innerHTML = html;
        }

        function showError(message) {
            weatherContainer.innerHTML = `<div class="error">${message}</div>`;
        }

        async function searchWeatherByCity(city) {
            weatherContainer.innerHTML = '<div class="loading">Loading...</div>';
            const coords = await getCoordinates(city);
            if (coords) {
                await getWeather(coords.lat, coords.lon, coords.name);
            }
        }

        function searchWeather() {
            const city = document.getElementById('searchInput').value;
            if (city.trim()) {
                searchWeatherByCity(city);
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                searchWeather();
            }
        }

        // Load London weather on page load
        window.addEventListener('load', () => {
            searchWeatherByCity('London');
        });
    </script>
</body>
</html>
